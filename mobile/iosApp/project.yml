name: iosApp
options:
  bundleIdPrefix: com.pints793.mobile
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        # Required by Compose Multiplatform on high-refresh-rate iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Empty UILaunchScreen dict tells iOS to run full-screen on modern iPhones
        # (without it the app is letterboxed with black bars top/bottom).
        UILaunchScreen: {}
        # Dev only: allow cleartext HTTP to the Spring backend on the host machine.
        # Strip from release builds.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pints793.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build & embed Kotlin shared framework"
        # No input/output files + basedOnDependencyAnalysis:false → script always runs.
        # Gradle's own up-to-date check decides whether to actually relink.
        # The backend URL comes from `mobile/gradle.properties → IOS_BASE_URL`
        # (so ngrok URLs persist across Xcode builds without per-scheme tweaks).
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

